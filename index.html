<style>
:root{--teal:#1A5F7A;--teal2:#2C8CA8;--tealbg:#E8F2F5;--soft:#F4F8FA;--ink:#1f2a30;--muted:#5d6b73;--ok:#1E8E4E;--okbg:#E5F5EB;--ko:#C0392B;--kobg:#FBEAE8;--amber:#B9770E;--line:#d9e3e8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--soft);font-size:17px;line-height:1.45}
.ar,.mono,input.ans{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace}
.ar .dg{color:var(--teal);font-weight:800}
header{position:sticky;top:0;z-index:5;background:var(--teal);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
header h1{font-size:18px;margin:0;flex:1;font-weight:700;letter-spacing:.2px}
header .score{background:rgba(255,255,255,.18);border-radius:999px;padding:5px 12px;font-size:15px;font-weight:600;white-space:nowrap}
header button.home{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:10px;font-size:16px;padding:8px 12px;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:16px 14px calc(40px + env(safe-area-inset-bottom))}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 1px 3px rgba(26,95,122,.12);margin-bottom:14px}
h2{font-size:17px;color:var(--teal);margin:0 0 10px}
.muted{color:var(--muted);font-size:15px}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.mode{display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px;min-height:74px;cursor:pointer;font-size:16px;color:var(--ink);transition:border-color .15s,transform .1s}
.mode:hover{border-color:var(--teal2)} .mode:active{transform:scale(.98)}
.mode .ic{flex:0 0 44px;height:44px;border-radius:12px;background:var(--tealbg);color:var(--teal);display:flex;align-items:center;justify-content:center;font-weight:800;font-family:ui-monospace,Menlo,monospace;font-size:16px}
.mode b{display:block;font-size:16px} .mode small{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:999px;padding:8px 14px;min-height:44px;cursor:pointer;background:#fff;font-size:15px;user-select:none}
.chip input{width:18px;height:18px;accent-color:var(--teal);margin:0}
.chip.on{border-color:var(--teal);background:var(--tealbg)}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.seg button{flex:1 1 auto;min-height:44px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font-size:15px;cursor:pointer;color:var(--ink)}
.seg button.on{border-color:var(--teal);background:var(--teal);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:10px 18px;border-radius:14px;border:0;font-size:17px;font-weight:600;cursor:pointer;background:var(--teal);color:#fff}
.btn.sec{background:var(--tealbg);color:var(--teal)} .btn.ok{background:var(--ok)} .btn.ko{background:var(--ko)} .btn.ghost{background:transparent;color:var(--muted);border:2px solid var(--line)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap} .row>.btn{flex:1 1 140px}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:12px}
.progress i{display:block;height:100%;background:var(--teal2);transition:width .2s}
.flash{perspective:1200px;margin-bottom:14px;cursor:pointer;user-select:none}
.flash .inner{position:relative;min-height:240px;transition:transform .45s;transform-style:preserve-3d}
.flash.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;border-radius:20px;box-shadow:0 2px 10px rgba(26,95,122,.15);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center}
.face.back{transform:rotateY(180deg);background:var(--tealbg)}
.face .big{font-size:28px;font-weight:700;word-break:break-word}
.face .sub{margin-top:10px;color:var(--muted);font-size:15px}
.face .tag{position:absolute;top:12px;left:14px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.face .hint{position:absolute;bottom:12px;font-size:13px;color:var(--muted)}
.badge{display:inline-block;font-size:12px;font-weight:600;background:#FFF3D6;color:var(--amber);border:1px solid #F1D08A;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:middle;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
.lbadge{display:inline-block;font-size:12px;background:var(--tealbg);color:var(--teal);border-radius:999px;padding:2px 8px}
.prompt{font-size:24px;font-weight:700;margin:6px 0 4px;word-break:break-word}
.prompt .pron{color:var(--teal)}
input.ans{width:100%;font-size:20px;padding:14px 14px;border-radius:14px;border:2px solid var(--line);outline:none;background:#fff;color:var(--ink);margin:10px 0}
input.ans:focus{border-color:var(--teal2)}
.fb{border-radius:14px;padding:12px 14px;margin:6px 0 12px;font-size:16px}
.fb.ok{background:var(--okbg);color:var(--ok);border:2px solid #9fd8b4}
.fb.ko{background:var(--kobg);color:var(--ko);border:2px solid #efb3ab}
.fb .exp{font-size:20px;font-weight:700;color:var(--ink);margin-top:4px}
table.grid{width:100%;border-collapse:separate;border-spacing:0 8px}
table.grid td{vertical-align:middle}
table.grid td.p{width:34%;padding-right:8px;font-weight:700;color:var(--teal)}
table.grid td.p small{display:block;font-weight:400;color:var(--muted);font-size:13px;font-family:-apple-system,sans-serif}
table.grid input{width:100%;font-size:18px;padding:11px 12px;border-radius:12px;border:2px solid var(--line);font-family:ui-monospace,"SF Mono",Menlo,monospace}
table.grid input.ok{border-color:var(--ok);background:var(--okbg)}
table.grid input.ko{border-color:var(--ko);background:var(--kobg);text-decoration:line-through;color:var(--ko)}
table.grid .corr{font-size:15px;color:var(--ok);font-weight:700;margin-top:3px}
select{width:100%;font-size:17px;min-height:48px;border-radius:12px;border:2px solid var(--line);padding:8px 10px;background:#fff;color:var(--ink)}
.errlist{list-style:none;padding:0;margin:0}
.errlist li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.errlist li .n{color:var(--ko);font-weight:700;white-space:nowrap}
.legend{font-size:14px;color:var(--muted);margin-top:8px}
.summary{text-align:center;padding:26px 18px}
.summary .big{font-size:44px;font-weight:800;color:var(--teal)}
.boxes{display:flex;gap:6px;margin-top:8px}
.boxes span{flex:1;text-align:center;background:var(--tealbg);border-radius:10px;padding:6px 0;font-size:13px;color:var(--teal)}
.boxes span b{display:block;font-size:17px}
@media (max-width:480px){.face .big{font-size:24px}.prompt{font-size:21px}header h1{font-size:16px}}

</style>
</head>

  { lesson: "1019", cat: "phrase", fr: "À quelle heure tu t’es réveillé ?", ar: "ayya se3a fe2et?", rep: "ana fe2et lse3a 7.", repFr: "Je me suis réveillé à 7 h." },

  { lesson: "1019", cat: "phrase", fr: "Je suis fâché mais elle est contente.", ar: "ana za3len bas hiye mabsouta." },

</script>
<script>
/* ===================== MOTEUR DE L’APPLI ===================== */
(function () {
  "use strict";
  // ids stables
  ITEMS.forEach(function (it) {
    it.id = [it.lesson, it.cat, it.group || "", it.pron || "", it.ar].join("|");
    it.alt = it.alt || [];
  });
  var LKEY = "revArabe.v1";
  var store = load();
  function load() {
    try { var s = JSON.parse(localStorage.getItem(LKEY)); if (s && s.boxes) return s; } catch (e) {}
    return { boxes: {}, errors: {}, lessons: null };
  }
  function save() { try { localStorage.setItem(LKEY, JSON.stringify(store)); } catch (e) {} }
  var session = { ok: 0, total: 0 };
  var selLessons = store.lessons || LESSONS.map(function (l) { return l.id; });

  /* ---------- outils ---------- */
  function $(s) { return document.querySelector(s); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function arHTML(s) { return '<span class="ar">' + esc(s).replace(/[0-9]/g, function (d) { return '<span class="dg">' + d + "</span>"; }) + "</span>"; }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function lessonOf(id) { for (var i = 0; i < LESSONS.length; i++) if (LESSONS[i].id === id) return LESSONS[i]; return { label: id }; }
  function badge(it) { return it && it.analogy ? '<span class="badge" title="Pas écrit au tableau, complété sur le même patron">par analogie</span>' : ""; }
  function lbadge(it) { return '<span class="lbadge">' + esc(lessonOf(it.lesson).label) + "</span>"; }
  function inLessons(it) { return selLessons.indexOf(it.lesson) >= 0; }
  function pick(cats) { return ITEMS.filter(function (it) { return cats.indexOf(it.cat) >= 0 && inLessons(it); }); }

  /* comparaison tolérante */
  function norm(s) {
    s = String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    s = s.replace(/[’'`]/g, "").replace(/\.\.\.|…/g, " ");
    s = s.replace(/[?!.,;:«»"\-_\/()]/g, " ");
    s = s.replace(/ch/g, "sh").replace(/ou/g, "o").replace(/y/g, "i");
    s = s.split(/\s+/).filter(Boolean).map(function (w) { return w.length > 2 ? w.replace(/h$/, "") : w; }).join(" ");
    s = s.replace(/([a-z])\1+/g, "$1");
    return s.replace(/\s+/g, "");
  }
  function frNorm(s) {
    s = String(s).toLowerCase().replace(/\b[ld][’']\s*/g, "").replace(/\s*\(.*?\)\s*/g, " ").trim();
    s = s.replace(/^(le|la|les|un|une|des|du|de)\s+/, "");
    return norm(s);
  }
  function frCandidates(fr) {
    var out = [fr];
    var noPar = fr.replace(/\(.*?\)/g, " ");
    noPar.split(/\s*\/\s*|\s*,\s*|\s+ou\s+/).forEach(function (p) { if (p.trim()) out.push(p.trim()); });
    return out;
  }
  function stripPron(input, pron) {
    var n = norm(input), p = pron ? norm(pron) : "";
    if (p && n.indexOf(p) === 0 && n.length > p.length) return n.slice(p.length);
    return n;
  }

  /* question pour un item */
  function question(it, dir) {
    var q = {}, g = GROUPS[it.group];
    if (it.cat === "conj" || it.cat === "poss" || it.cat === "adj") {
      var verb = it.cat === "conj" ? " au passé" : it.cat === "poss" ? " + possessif" : " (accord)";
      q.html = '<span class="pron ar">' + esc(it.pron) + '</span> <span class="muted">(' + esc(PRON_FR[it.pron]) + ")</span><br>" + arHTML(g.label) + ' <span class="muted">' + esc(g.fr) + verb + "</span>";
      q.answers = [it.ar].concat(it.alt, it.full ? [it.full] : []);
      q.expected = it.ar + (it.full && it.full !== it.ar ? "  (" + it.full + ")" : "");
      q.check = function (v) { var n = stripPron(v, it.pron); return q.answers.some(function (a) { return norm(a) === n || stripPron(a, it.pron) === n; }); };
      q.placeholder = "forme en arabizi";
      return q;
    }
    if (it.cat === "nombre") {
      if (dir === "ar2fr") {
        q.html = arHTML(it.ar); q.expected = it.fr; q.placeholder = "le nombre en chiffres";
        q.check = function (v) { return String(v).replace(/\D/g, "") === it.fr; };
      } else {
        q.html = '<span class="mono" style="font-size:40px">' + esc(it.fr) + "</span>"; q.expected = it.ar; q.placeholder = "en arabizi";
        q.check = function (v) { return [it.ar].concat(it.alt).some(function (a) { return norm(a) === norm(v); }); };
      }
      return q;
    }
    // vocab, couleur, phrase
    if (dir === "ar2fr") {
      var same = ITEMS.filter(function (x) { return (x.cat === it.cat || (x.cat !== "phrase" && it.cat !== "phrase")) && norm(x.ar) === norm(it.ar); });
      var cands = [];
      same.forEach(function (x) { cands = cands.concat(frCandidates(x.fr)); });
      q.html = arHTML(it.ar); q.expected = it.fr; q.placeholder = "en français";
      q.check = function (v) { var n = frNorm(v); return n && cands.some(function (c) { return frNorm(c) === n; }); };
    } else {
      var same2 = ITEMS.filter(function (x) { return x.cat !== "conj" && x.cat !== "poss" && x.cat !== "adj" && frNorm(x.fr) === frNorm(it.fr); });
      var ans = [];
      same2.forEach(function (x) { ans = ans.concat([x.ar], x.alt); });
      q.html = esc(it.fr); q.expected = [it.ar].concat(it.alt).join("  ou  "); q.placeholder = "en arabizi";
      q.check = function (v) { var n = norm(v); return n && ans.some(function (a) { return norm(a) === n; }); };
    }
    return q;
  }

  /* score, erreurs, leitner */
  function scoreUI() { var s = $("#score"); if (s) s.textContent = session.ok + " / " + session.total; }
  function record(it, good, dir) {
    session.total++; if (good) session.ok++;
    if (good) { store.boxes[it.id] = Math.min(5, (store.boxes[it.id] || 1) + 1); }
    else { store.boxes[it.id] = 1; var e = store.errors[it.id] || { n: 0 }; e.n++; e.dir = dir; store.errors[it.id] = e; }
    save(); scoreUI();
  }
  function box(it) { return store.boxes[it.id] || 1; }
  function buildDeck(items, n) {
    var arr = shuffle(items).sort(function (a, b) { return box(a) - box(b); });
    return arr.slice(0, n || 20);
  }
  function dirFor(d) { return d === "mix" ? (Math.random() < 0.5 ? "fr2ar" : "ar2fr") : d; }

  /* ---------- écrans ---------- */
  var view = $("#view");
  var state = {};
  function setTitle(t) { $("#title").textContent = t; $("#homeBtn").style.visibility = t === "Révision arabe libanais" ? "hidden" : "visible"; window.scrollTo(0, 0); }

  var MODES = [
    { id: "flash", ic: "A⇄", t: "Cartes vocabulaire", d: "retourne la carte, je savais ou à revoir" },
    { id: "quiz", ic: "abc", t: "Quiz vocabulaire", d: "tape la réponse" },
    { id: "conj", ic: "et", t: "Conjugaison", d: "le passé, une forme ou tout le tableau" },
    { id: "poss", ic: "e·ak", t: "Possessifs", d: "ktebe, bebak, 3omro, ele…" },
    { id: "adj", ic: "+a", t: "Accords", d: "mabsout, za3len, m2a55ar" },
    { id: "num", ic: "42", t: "Nombres", d: "chiffre ou arabizi" },
    { id: "phr", ic: "?!", t: "Phrases", d: "questions et réponses du cours" },
    { id: "err", ic: "✗", t: "Mes erreurs", d: "revoir ce qui a coincé" }
  ];

  function home() {
    setTitle("Révision arabe libanais");
    var nErr = Object.keys(store.errors).length;
    var h = '<div class="card"><h2>Cours à réviser</h2><div class="chips" id="lessons">';
    h += '<label class="chip ' + (selLessons.length === LESSONS.length ? "on" : "") + '"><input type="checkbox" data-all="1" ' + (selLessons.length === LESSONS.length ? "checked" : "") + "> tout</label>";
    LESSONS.forEach(function (l) {
      var on = selLessons.indexOf(l.id) >= 0;
      h += '<label class="chip ' + (on ? "on" : "") + '" title="' + esc(l.title) + '"><input type="checkbox" data-l="' + l.id + '" ' + (on ? "checked" : "") + "> " + esc(l.label) + "</label>";
    });
    h += '</div><p class="muted" style="margin:10px 0 0">' + pick(["vocab", "couleur", "nombre", "phrase", "conj", "poss", "adj"]).length + " cartes dans la sélection.</p></div>";
    h += '<div class="modes">';
    MODES.forEach(function (m) {
      h += '<button class="mode" data-mode="' + m.id + '"><span class="ic">' + esc(m.ic) + "</span><span><b>" + esc(m.t) + (m.id === "err" && nErr ? " (" + nErr + ")" : "") + "</b><small>" + esc(m.d) + "</small></span></button>";
    });
    h += "</div>";
    var vocab = ITEMS.filter(function (x) { return x.cat === "vocab" || x.cat === "couleur"; });
    var counts = [0, 0, 0, 0, 0];
    vocab.forEach(function (x) { counts[box(x) - 1]++; });
    h += '<div class="card" style="margin-top:14px"><h2>Tes boîtes de mots</h2><div class="muted">Boîte 1 : à revoir souvent. Boîte 5 : acquis.</div><div class="boxes">';
    counts.forEach(function (c, i) { h += "<span>boîte " + (i + 1) + "<b>" + c + "</b></span>"; });
    h += '</div></div><div class="row"><button class="btn ghost" id="reset">Tout remettre à zéro</button></div>';
    h += '<p class="legend">Code arabizi : ' + [["3","ع"],["7","ح"],["5","خ"],["8","غ"],["2","ء ou ق"]].map(function (c) { return '<span style="display:inline-block;margin-right:12px"><span class="ar"><span class="dg">' + c[0] + '</span></span> = <bdi>' + c[1] + '</bdi></span>'; }).join("") + '<br>Les chiffres sont en couleur pour bien les voir.</p>';
    view.innerHTML = h;
    view.querySelectorAll("#lessons input").forEach(function (cb) {
      cb.addEventListener("change", function () {
        if (cb.dataset.all) selLessons = cb.checked ? LESSONS.map(function (l) { return l.id; }) : [];
        else {
          var id = cb.dataset.l;
          if (cb.checked) { if (selLessons.indexOf(id) < 0) selLessons.push(id); } else selLessons = selLessons.filter(function (x) { return x !== id; });
        }
        store.lessons = selLessons; save(); home();
      });
    });
    view.querySelectorAll("[data-mode]").forEach(function (b) { b.addEventListener("click", function () { go(b.dataset.mode); }); });
    $("#reset").addEventListener("click", function () {
      if (confirm("Tout remettre à zéro ? Les boîtes, les erreurs et le score seront effacés.")) {
        store = { boxes: {}, errors: {}, lessons: null }; selLessons = LESSONS.map(function (l) { return l.id; }); session = { ok: 0, total: 0 }; save(); scoreUI(); home();
      }
    });
  }

  function empty(msg) { view.innerHTML = '<div class="card"><p>' + esc(msg) + '</p><button class="btn" id="back">Retour</button></div>'; $("#back").onclick = home; }

  function go(m) {
    if (m === "flash") return setupFlash("vocab");
    if (m === "phr") return setupFlash("phrase");
    if (m === "quiz") return setupQuiz("vocab");
    if (m === "num") return setupQuiz("nombre");
    if (m === "conj" || m === "poss" || m === "adj") return setupGroup(m);
    if (m === "err") return errorsScreen();
  }

  /* ---------- Cartes ---------- */
  function setupFlash(kind) {
    var isPh = kind === "phrase";
    setTitle(isPh ? "Phrases" : "Cartes vocabulaire");
    var dirs = isPh ? [["fr2ar", "FR → arabe"], ["ar2fr", "arabe → FR"], ["qa", "question → réponse"], ["mix", "aléatoire"]] : [["fr2ar", "FR → arabe"], ["ar2fr", "arabe → FR"], ["mix", "aléatoire"]];
    var d = state["fdir" + kind] || "fr2ar";
    var h = '<div class="card"><h2>Sens</h2><div class="seg" id="dirs">';
    dirs.forEach(function (x) { h += '<button data-d="' + x[0] + '" class="' + (x[0] === d ? "on" : "") + '">' + esc(x[1]) + "</button>"; });
    h += "</div>";
    if (!isPh) h += '<h2>Quoi</h2><div class="seg" id="cats"><button data-c="all" class="on">mots + couleurs</button><button data-c="vocab">mots</button><button data-c="couleur">couleurs</button></div>';
    h += '<button class="btn" id="start" style="width:100%">C’est parti</button></div>';
    view.innerHTML = h;
    var cat = "all";
    view.querySelectorAll("#dirs button").forEach(function (b) { b.onclick = function () { d = b.dataset.d; state["fdir" + kind] = d; view.querySelectorAll("#dirs button").forEach(function (x) { x.classList.toggle("on", x === b); }); }; });
    view.querySelectorAll("#cats button").forEach(function (b) { b.onclick = function () { cat = b.dataset.c; view.querySelectorAll("#cats button").forEach(function (x) { x.classList.toggle("on", x === b); }); }; });
    $("#start").onclick = function () {
      var items = isPh ? pick(["phrase"]) : pick(cat === "all" ? ["vocab", "couleur"] : [cat]);
      if (d === "qa") items = items.filter(function (x) { return x.rep; });
      if (!items.length) return empty("Rien à réviser avec ces cours. Coche d’autres dates sur l’accueil.");
      runFlash(buildDeck(items, 20), d, function () { setupFlash(kind); });
    };
  }

  function runFlash(deck, d, again) {
    var i = 0, ok = 0, total = deck.length, requeued = {};
    function show() {
      if (i >= deck.length) return summary(ok, deck.length, again);
      var it = deck[i], dd = d === "qa" ? "qa" : dirFor(d), front, back;
      if (dd === "qa") { front = arHTML(it.ar) + '<div class="sub">' + esc(it.fr) + "</div>"; back = arHTML(it.rep) + '<div class="sub">' + esc(it.repFr || "") + "</div>"; }
      else if (dd === "fr2ar") { front = esc(it.fr); back = arHTML(it.ar) + (it.alt.length ? '<div class="sub">aussi : ' + arHTML(it.alt.join(", ")) + "</div>" : ""); }
      else { front = arHTML(it.ar); back = esc(it.fr); }
      var note = (it.notes ? '<div class="sub">' + esc(it.notes) + "</div>" : "") + (it.rep && dd !== "qa" ? '<div class="sub">réponse type : ' + arHTML(it.rep) + "</div>" : "");
      view.innerHTML = '<div class="progress"><i style="width:' + Math.round(100 * i / deck.length) + '%"></i></div>' +
        '<div class="flash" id="fc"><div class="inner"><div class="face front"><span class="tag">' + esc(lessonOf(it.lesson).label) + '</span><div class="big">' + front + badge(it) + '</div><span class="hint">touche pour retourner</span></div>' +
        '<div class="face back"><span class="tag">réponse</span><div class="big">' + back + "</div>" + note + "</div></div></div>" +
        '<div class="row" id="ans" style="visibility:hidden"><button class="btn ko" id="no">À revoir</button><button class="btn ok" id="yes">Je savais</button></div>' +
        '<p class="muted" style="text-align:center">' + (i + 1) + " / " + deck.length + " · boîte " + box(it) + "</p>";
      var fc = $("#fc");
      fc.onclick = function () { fc.classList.toggle("flipped"); $("#ans").style.visibility = "visible"; };
      $("#yes").onclick = function () { record(it, true, dd === "qa" ? "fr2ar" : dd); if (!requeued[it.id]) ok++; i++; show(); };
      $("#no").onclick = function () {
        record(it, false, dd === "qa" ? "fr2ar" : dd);
        if (!requeued[it.id]) { requeued[it.id] = 1; deck.splice(Math.min(deck.length, i + 4), 0, it); }
        i++; show();
      };
    }
    show();
  }

  function summary(ok, total, again) {
    view.innerHTML = '<div class="card summary"><div class="muted">Série terminée</div><div class="big">' + ok + " / " + total + '</div><p>' + (ok === total ? "Parfait, bravo !" : ok >= total * 0.7 ? "Très bien, continue comme ça." : "Ça rentre, on recommence ?") + '</p><div class="row"><button class="btn" id="again">Encore une série</button><button class="btn sec" id="hm">Accueil</button></div></div>';
    $("#again").onclick = again; $("#hm").onclick = home;
  }

  /* ---------- Quiz tapé ---------- */
  function setupQuiz(kind) {
    var isNum = kind === "nombre";
    setTitle(isNum ? "Nombres" : "Quiz vocabulaire");
    var dirs = isNum ? [["fr2ar", "chiffre → arabizi"], ["ar2fr", "arabizi → chiffre"], ["mix", "aléatoire"]] : [["fr2ar", "FR → arabe"], ["ar2fr", "arabe → FR"], ["mix", "aléatoire"]];
    var d = state["qdir" + kind] || "fr2ar", cat = "all";
    var h = '<div class="card"><h2>Sens</h2><div class="seg" id="dirs">';
    dirs.forEach(function (x) { h += '<button data-d="' + x[0] + '" class="' + (x[0] === d ? "on" : "") + '">' + esc(x[1]) + "</button>"; });
    h += "</div>";
    if (!isNum) h += '<h2>Quoi</h2><div class="seg" id="cats"><button data-c="all" class="on">mots + couleurs</button><button data-c="vocab">mots</button><button data-c="couleur">couleurs</button><button data-c="phrase">phrases</button></div>';
    h += '<button class="btn" id="start" style="width:100%">C’est parti</button><p class="legend">Pas de stress sur l’orthographe : majuscules, accents, espaces, ee ou e, ou ou o, y ou i, ch ou sh et le h final ne comptent pas.</p></div>';
    view.innerHTML = h;
    view.querySelectorAll("#dirs button").forEach(function (b) { b.onclick = function () { d = b.dataset.d; state["qdir" + kind] = d; view.querySelectorAll("#dirs button").forEach(function (x) { x.classList.toggle("on", x === b); }); }; });
    view.querySelectorAll("#cats button").forEach(function (b) { b.onclick = function () { cat = b.dataset.c; view.querySelectorAll("#cats button").forEach(function (x) { x.classList.toggle("on", x === b); }); }; });
    $("#start").onclick = function () {
      var items = isNum ? pick(["nombre"]) : pick(cat === "all" ? ["vocab", "couleur"] : [cat]);
      if (!items.length) return empty(isNum ? "Les nombres sont dans le cours du 15 oct. Coche-le sur l’accueil." : "Rien à réviser avec ces cours. Coche d’autres dates sur l’accueil.");
      runQuiz(buildDeck(items, isNum ? items.length : 15).map(function (it) { return { it: it, dir: dirFor(d) }; }), function () { setupQuiz(kind); });
    };
  }

  function runQuiz(deck, again, fromErrors) {
    var i = 0, ok = 0;
    function show() {
      if (i >= deck.length) return summary(ok, deck.length, again);
      var cur = deck[i], it = cur.it, q = question(it, cur.dir), answered = false;
      view.innerHTML = '<div class="progress"><i style="width:' + Math.round(100 * i / deck.length) + '%"></i></div><div class="card"><div class="muted">' + lbadge(it) + " " + (i + 1) + " / " + deck.length + '</div><div class="prompt">' + q.html + badge(it) + '</div>' +
        '<input class="ans" id="in" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="' + esc(q.placeholder) + '" ' + (q.placeholder.indexOf("chiffres") >= 0 ? 'inputmode="numeric"' : "") + '>' +
        '<div id="fb"></div><div class="row"><button class="btn" id="go">Vérifier</button></div></div>';
      var inp = $("#in"); inp.focus();
      function check() {
        if (answered) { i++; return show(); }
        answered = true;
        var good = q.check(inp.value);
        if (good) ok++;
        record(it, good, cur.dir);
        if (fromErrors && good) { delete store.errors[it.id]; save(); }
        var note = it.notes ? '<div class="muted">' + esc(it.notes) + "</div>" : "";
        $("#fb").innerHTML = '<div class="fb ' + (good ? "ok" : "ko") + '">' + (good ? "Juste !" : "Pas tout à fait. La réponse :") + '<div class="exp">' + (cur.dir === "ar2fr" && it.cat !== "conj" ? esc(q.expected) : arHTML(q.expected)) + badge(it) + "</div>" + note + "</div>" +
          (good ? "" : '<button class="btn ghost" id="override" style="width:100%;margin-bottom:10px">En fait, j’avais juste</button>');
        inp.readOnly = true;
        $("#go").textContent = "Suivant";
        var ov = $("#override");
        if (ov) ov.onclick = function () {
          ok++; session.ok++; store.boxes[it.id] = 2; var e = store.errors[it.id]; if (e) { e.n--; if (e.n <= 0) delete store.errors[it.id]; } save(); scoreUI(); i++; show();
        };
        $("#go").focus();
      }
      $("#go").onclick = check;
      inp.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); check(); } });
    }
    show();
  }

  /* ---------- Conjugaison, possessifs, accords ---------- */
  function groupsOf(cat) {
    var gs = [];
    Object.keys(GROUPS).forEach(function (g) {
      if (GROUPS[g].cat !== cat) return;
      var its = ITEMS.filter(function (x) { return x.group === g && inLessons(x); });
      if (its.length) gs.push({ id: g, items: its });
    });
    return gs;
  }
  function setupGroup(cat) {
    var title = { conj: "Conjugaison", poss: "Possessifs", adj: "Accords" }[cat];
    setTitle(title);
    var gs = groupsOf(cat);
    if (!gs.length) return empty("Rien pour ces cours. Coche d’autres dates sur l’accueil.");
    var mode = state["gmode" + cat] || "one", sel = state["gsel" + cat] || "rand";
    if (sel !== "rand" && !gs.some(function (g) { return g.id === sel; })) sel = "rand";
    var h = '<div class="card"><h2>Exercice</h2><div class="seg" id="gm"><button data-m="one" class="' + (mode === "one" ? "on" : "") + '">une forme à la fois</button><button data-m="grid" class="' + (mode === "grid" ? "on" : "") + '">tableau à compléter</button></div>';
    h += '<h2>' + (cat === "conj" ? "Verbe" : cat === "poss" ? "Nom" : "Adjectif") + '</h2><select id="gs"><option value="rand">au hasard (tous)</option>';
    gs.forEach(function (g) { var G = GROUPS[g.id]; h += '<option value="' + esc(g.id) + '" ' + (sel === g.id ? "selected" : "") + ">" + esc(G.label + " · " + G.fr + (g.items.length < 8 ? " (" + g.items.length + " formes vues)" : "")) + "</option>"; });
    h += '</select><div style="height:12px"></div><button class="btn" id="start" style="width:100%">C’est parti</button>';
    if (cat === "conj") h += '<p class="legend">Pour hiye, la fin s’entend et ou it : les deux sont acceptées.</p>';
    if (cat === "poss") h += '<p class="legend">Tape juste le nom avec le suffixe (ex. ktebe). La phrase complète (hayda ktebe) est acceptée aussi.</p>';
    h += "</div>";
    view.innerHTML = h;
    view.querySelectorAll("#gm button").forEach(function (b) { b.onclick = function () { mode = b.dataset.m; state["gmode" + cat] = mode; view.querySelectorAll("#gm button").forEach(function (x) { x.classList.toggle("on", x === b); }); }; });
    $("#gs").onchange = function () { sel = this.value; state["gsel" + cat] = sel; };
    $("#start").onclick = function () {
      var again = function () { setupGroup(cat); };
      if (mode === "grid") {
        var g = sel === "rand" ? shuffle(gs.filter(function (x) { return x.items.length >= 3; }))[0] || gs[0] : gs.filter(function (x) { return x.id === sel; })[0];
        return runGrid(g, cat);
      }
      var items = sel === "rand" ? [].concat.apply([], gs.map(function (g) { return g.items; })) : gs.filter(function (x) { return x.id === sel; })[0].items;
      runQuiz(buildDeck(items, Math.min(12, items.length)).map(function (it) { return { it: it, dir: "fr2ar" }; }), again);
    };
  }

  function runGrid(g, cat) {
    var G = GROUPS[g.id];
    var rows = PRONOUNS.map(function (p) { return g.items.filter(function (x) { return x.pron === p; })[0]; }).filter(Boolean);
    var h = '<div class="card"><div class="prompt">' + arHTML(G.label) + ' <span class="muted" style="font-size:17px">' + esc(G.fr) + (cat === "conj" ? ", au passé" : "") + '</span></div><table class="grid">';
    rows.forEach(function (it, k) {
      h += '<tr><td class="p">' + arHTML(it.pron) + "<small>" + esc(PRON_FR[it.pron]) + '</small></td><td><input data-k="' + k + '" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"><div class="corr" id="c' + k + '"></div></td></tr>';
    });
    h += '</table><div id="gres"></div><div class="row"><button class="btn" id="corr">Corriger</button><button class="btn sec" id="other">Autre tableau</button></div></div>';
    view.innerHTML = h;
    var inputs = view.querySelectorAll("table.grid input");
    inputs.forEach(function (inp, k) { inp.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); if (inputs[k + 1]) inputs[k + 1].focus(); else $("#corr").click(); } }); });
    inputs[0].focus();
    var done = false;
    $("#corr").onclick = function () {
      if (done) { return runGrid(g, cat); }
      done = true; var good = 0;
      rows.forEach(function (it, k) {
        var q = question(it, "fr2ar"), inp = inputs[k], r = q.check(inp.value);
        if (r) good++;
        record(it, r, "fr2ar");
        inp.classList.add(r ? "ok" : "ko"); inp.readOnly = true;
        $("#c" + k).innerHTML = (r ? "" : arHTML(it.ar)) + badge(it) + (it.alt.length && r ? "" : "");
      });
      $("#gres").innerHTML = '<div class="fb ' + (good === rows.length ? "ok" : "ko") + '">' + good + " / " + rows.length + (good === rows.length ? " · tout juste, bravo !" : " · la bonne forme est en vert sous chaque erreur.") + "</div>";
      $("#corr").textContent = "Recommencer";
    };
    $("#other").onclick = function () { setupGroup(cat); };
  }

  /* ---------- Mes erreurs ---------- */
  function errorsScreen() {
    setTitle("Mes erreurs");
    var ids = Object.keys(store.errors);
    var items = ITEMS.filter(function (x) { return store.errors[x.id]; });
    if (!items.length) { view.innerHTML = '<div class="card"><p>Aucune erreur pour l’instant. Bravo !</p><button class="btn" id="back">Accueil</button></div>'; $("#back").onclick = home; return; }
    items.sort(function (a, b) { return store.errors[b.id].n - store.errors[a.id].n; });
    var h = '<div class="card"><h2>' + items.length + ' à retravailler</h2><div class="row" style="margin-bottom:10px"><button class="btn" id="replay">Rejouer mes erreurs</button><button class="btn ghost" id="clear">Vider la liste</button></div><ul class="errlist">';
    items.forEach(function (it) {
      var left = it.pron ? arHTML(it.pron) + " · " + arHTML(GROUPS[it.group].label) : esc(it.fr);
      h += "<li><span>" + left + " → <b>" + arHTML(it.ar) + "</b>" + badge(it) + '</span><span class="n">' + store.errors[it.id].n + "×</span></li>";
    });
    h += '</ul><p class="legend">Une erreur sort de la liste quand tu la réussis en rejouant.</p></div>';
    view.innerHTML = h;
    $("#replay").onclick = function () {
      runQuiz(shuffle(items).map(function (it) { return { it: it, dir: store.errors[it.id].dir === "ar2fr" ? "ar2fr" : "fr2ar" }; }), errorsScreen, true);
    };
    $("#clear").onclick = function () { if (confirm("Vider la liste des erreurs ?")) { store.errors = {}; save(); errorsScreen(); } };
  }

  $("#homeBtn").onclick = home;
  scoreUI();
  home();
  window.__app = { norm: norm, frNorm: frNorm, question: question, ITEMS: ITEMS, go: go, home: home };
})();

</script>
</body>
</html>
